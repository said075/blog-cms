services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: blog-cms-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blog_cms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prisma Studio (Optional - Database GUI)
  # Uncomment to run Prisma Studio in Docker
  # prisma-studio:
  #   image: node:18-alpine
  #   container_name: blog-cms-prisma-studio
  #   working_dir: /app
  #   ports:
  #     - "5555:5555"
  #   volumes:
  #     - .:/app
  #   command: sh -c "npm install && npx prisma studio"
  #   depends_on:
  #     - postgres

volumes:
  postgres_data:
    driver: local
